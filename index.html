function resetGesture(){pointer=null;$('#document').classList.remove('dragging','flying');for(const k of ['dx','dy'])$('#document').style.setProperty('--'+k,'0px');$('#document').style.setProperty('--tilt','0deg');document.querySelectorAll('.choice').forEach(b=>b.classList.remove('aim'));document.querySelectorAll('.edge').forEach(b=>b.style.opacity='0')}
